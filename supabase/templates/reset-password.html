<!-- Supabase → Authentication → Emails → "Reset password". Subject: Your Gitam Marketplace password reset code -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1f2a33">
  <p style="font-size:18px;font-weight:bold;color:#0f6e6e;margin:0 0 16px">Gitam Marketplace</p>
  <h1 style="font-size:20px;margin:0 0 12px">Reset your password</h1>
  <p style="margin:0 0 16px;line-height:1.5">We received a request to reset the password for this account. Enter this code on the reset page:</p>
  <p style="font-size:28px;letter-spacing:6px;font-weight:bold;margin:0 0 24px">{{ .Token }}</p>
  <p style="font-size:12px;color:#5b6770;line-height:1.5;margin:0">This code expires soon. If you didn't ask for this, ignore this email; your password won't change. Never share this code with anyone.</p>
</div>
