<!-- Supabase → Authentication → Emails → "Reset password". Subject: Reset your Gitam Trades password -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1f2a33">
  <p style="font-size:18px;font-weight:bold;color:#0f6e6e;margin:0 0 16px">Gitam Trades</p>
  <h1 style="font-size:20px;margin:0 0 12px">Reset your password</h1>
  <p style="margin:0 0 24px;line-height:1.5">We received a request to reset the password for this account.</p>
  <p style="margin:0 0 24px">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
       style="display:inline-block;background:#0f6e6e;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:bold">Choose a new password</a>
  </p>
  <p style="font-size:12px;color:#5b6770;line-height:1.5;margin:0">If you didn't ask for this, ignore this email; your password won't change. Never share this link with anyone.</p>
</div>
