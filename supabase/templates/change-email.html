<!-- Supabase → Authentication → Emails → "Change email address". Subject: Confirm your new Gitam Marketplace email -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1f2a33">
  <p style="font-size:18px;font-weight:bold;color:#0f6e6e;margin:0 0 16px">Gitam Marketplace</p>
  <h1 style="font-size:20px;margin:0 0 12px">Confirm your new email</h1>
  <p style="margin:0 0 24px;line-height:1.5">Confirm that you want to use {{ .NewEmail }} for your Gitam Marketplace account. Only @student.gitam.edu addresses are accepted.</p>
  <p style="margin:0 0 24px">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/account"
       style="display:inline-block;background:#0f6e6e;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:bold">Confirm new email</a>
  </p>
</div>
